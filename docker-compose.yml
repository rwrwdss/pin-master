version: '3.8'

services:
  pinmaster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinmaster
    image: pinmaster:latest
    volumes:
      # Монтируем директории для данных
      - ./data/config:/app/data/config
      - ./data/cookies:/app/data/cookies
      - ./data/images:/app/data/images
      - ./data/csv:/app/data/csv
      - ./data/logs:/app/data/logs
    environment:
      - HEADLESS=true
      - DISPLAY=:99
    # Для GUI приложения в Docker нужен Xvfb
    # В продакшене рекомендуется использовать headless режим
    command: xvfb-run -a python qt_main_window.py
    restart: unless-stopped
